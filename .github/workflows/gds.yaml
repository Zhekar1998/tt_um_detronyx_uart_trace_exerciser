name: gds

on:
  push:
  workflow_dispatch:

env:
  PDK: gf180mcuD
  PDK_ROOT: /home/runner/pdk
  PDK_VERSION: 54435919abffb937387ec956209f9cf5fd2dfbee
  AVALON_SCL_REF: c4648471c023690478e97c998edb6f2eac673298

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up GDS environment variables
        shell: bash
        run: |
          PDK="${PDK:-gf180mcuD}"
          TT_ARGS=""

          if [ "$PDK" == "sky130" ]; then
            PDK="sky130A"
          elif [ "$PDK" == "ihp" ]; then
            PDK="ihp-sg13g2"
          fi

          if [ "$PDK" == "gf180mcuD" ]; then
            TT_ARGS="--gf"
          elif [ "$PDK" == "ihp-sg13g2" ]; then
            TT_ARGS="--ihp"
          fi

          cat << __EOF >> "$GITHUB_ENV"
          PDK=$PDK
          TT_ARGS=$TT_ARGS
          __EOF

      - name: Install prerequisites
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Checkout tt-support-tools repo
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: main
          path: tt

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install GF180 PDK for Avalon overlay
        shell: bash
        run: |
          pip install ciel==2.2.0
          ciel enable --pdk "$PDK" "$PDK_VERSION"

      - name: Install Avalon 7T3V3 overlay
        shell: bash
        run: bash .github/scripts/install_avalon7t3v3_overlay.sh

      - name: Install tt-support-tools dependencies
        shell: bash
        run: pip install -r tt/requirements.txt

      - name: Fetch verilog and build config
        shell: bash
        run: ./tt/tt_tool.py --create-user-config $TT_ARGS

      - name: Apply Avalon 7T3V3 generated config
        shell: bash
        run: python .github/scripts/apply_avalon_user_config.py

      - name: Install LibreLane
        shell: bash
        run: pip install librelane==3.0.3

      - name: Make GDS with LibreLane
        shell: bash
        run: ./tt/tt_tool.py --harden $TT_ARGS

      - name: Show build files (for debugging)
        shell: bash
        run: find runs/wokwi/

      - name: Linter output
        if: always()
        shell: bash
        run: |
          LINTER_LOG=(runs/wokwi/*-verilator-lint/verilator-lint.log)
          LINTER_LOG=${LINTER_LOG[0]}

          echo "DEBUG LINTER_LOG *$LINTER_LOG*"
          cat $LINTER_LOG
          echo "END DEBUG"

          if [ -s "$LINTER_LOG" ]; then
            set +e
            count_error=$(egrep -i "^%Error"   $LINTER_LOG | wc -l)
            count_warn=$( egrep -i "^%Warning" $LINTER_LOG | wc -l)
            count_other=$(egrep -i "^%"        $LINTER_LOG | egrep -v "%(Warning|Error)" | wc -l)
            set -e

            open=""
            summary=""
            icon=":green_circle:"
            if [ $count_other -gt 0 ]; then
              summary="$count_other message(s)"
              icon=":orange_circle:"
            fi
            if [ $count_warn -gt 0 ]; then
              summary="$count_warn warning(s)"
              icon=":orange_circle:"
            fi
            if [ $count_error -gt 0 ]; then
              summary="$count_error error(s)"
              icon=":red_circle:"
              open="open"
            fi
            if [ -n "$summary" ]; then
              summary="[$summary]"
            fi

            echo "<details ${open}>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><h1>Linter output&nbsp;&nbsp;<h4>${summary} ${icon}</h4></h1></summary>" >> $GITHUB_STEP_SUMMARY
            echo "<pre>" >> $GITHUB_STEP_SUMMARY
            sed 's/^/    /' < $LINTER_LOG >> $GITHUB_STEP_SUMMARY
            echo "</pre>" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Yosys warnings
        shell: bash
        run: ./tt/tt_tool.py --print-warnings $TT_ARGS >> $GITHUB_STEP_SUMMARY

      - name: Routing summary
        shell: bash
        run: ./tt/tt_tool.py --print-stats $TT_ARGS >> $GITHUB_STEP_SUMMARY

      - name: Cell usage summary
        shell: bash
        run: |
          ./tt/tt_tool.py --print-cell-category $TT_ARGS >> "$GITHUB_STEP_SUMMARY" || \
            echo "WARNING: cell usage summary is unavailable for this standard-cell library." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs
          path: |
            src/*
            runs/wokwi/*

      - name: Prepare tt_submission artifact
        shell: bash
        run: ./tt/tt_tool.py --create-tt-submission $TT_ARGS

      - name: Publish tt_submission artifact
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: |
            src/*
            docs/*
            tt_submission/*
            info.yaml
            LICENSE

      - name: Render PNG from GDS
        shell: bash
        run: './tt/tt_tool.py --create-png $TT_ARGS 2>&1 || echo "WARNING: Failed to render PNG preview from GDS; error $?"'

      - name: Upload gds_render (png) artifact
        uses: actions/upload-artifact@v7
        with:
          name: gds_render
          path: 'gds_render.png'

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download GDS artifact
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: Set up environment variables
        working-directory: tt_submission
        shell: bash
        run: |
          PDK=$(jq -r '.PDK' pdk.json)
          PDK_VERSION=$(jq -r '.PDK_VERSION' pdk.json)

          cat << __EOF >> "$GITHUB_ENV"
          PDK=$PDK
          PDK_VERSION=$PDK_VERSION
          AS_SCL_VERILOG=$PDK_ROOT/$PDK/libs.ref/gf180mcu_as_sc_mcu7t3v3/verilog/gf180mcu_as_sc_mcu7t3v3.v
          __EOF

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install GF180 PDK
        shell: bash
        run: |
          pip install ciel==2.2.0
          ciel enable --pdk "$PDK" "$PDK_VERSION"

      - name: Install Avalon 7T3V3 overlay
        shell: bash
        run: bash .github/scripts/install_avalon7t3v3_overlay.sh

      - name: Install Python packages
        if: ${{ hashFiles('test/requirements.txt') != '' }}
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Install cocotb
        if: ${{ hashFiles('test/requirements.txt') == '' }}
        shell: bash
        run: pip install cocotb==1.8.0

      - name: Install iverilog
        shell: bash
        run: |
          wget https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Run GL tests
        shell: bash
        run: |
          cp tt_submission/*.v test/gate_level_netlist.v
          cd test
          rm -f tb.vcd tb.fst tb_rtl.fst tb_gl.fst results.xml
          make clean
          GATES=yes make
          test -f results.xml
          ! grep failure results.xml

      - name: Upload Waveform and Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatelevel_test_results
          path: |
            test/tb.vcd
            test/tb.fst
            test/tb_rtl.fst
            test/tb_gl.fst
            test/results.xml
            test/output/*

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: test/results.xml

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26a
